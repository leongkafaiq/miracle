<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boat and Lighthouse Investigation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .diagram { text-align: center; margin: 20px; }
    canvas { border: 1px solid #ccc; display: block; margin: auto; }
    .controls { margin: 20px; }
    .records { margin: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eef; }
    .formula { font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>🚤 Boat and Lighthouse Investigation</h1>
  <p>Move the boat closer to the lighthouse by changing the angle of elevation. Record your observations!</p>

  <div class="diagram">
    <canvas id="diagramCanvas" width="700" height="400"></canvas>
  </div>

  <div class="controls">
    <label for="angleSlider">Angle of Elevation (degrees): </label>
    <input type="range" id="angleSlider" min="20" max="80" step="1" value="30">
    <span id="angleValue">30°</span>
    <button id="recordBtn">Record Observation</button>
  </div>

  <div class="records">
    <h2>📝 Recorded Observations</h2>
    <div class="formula">
      Formula: tan(θ) = h / x → x = h / tan(θ)
    </div>
    <table id="recordTable">
      <thead>
        <tr>
          <th>Trial</th>
          <th>Angle (°)</th>
          <th>Horizontal Distance x (m)</th>
          <th>Height h (m)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const canvas = document.getElementById('diagramCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('angleSlider');
    const angleValue = document.getElementById('angleValue');
    const recordBtn = document.getElementById('recordBtn');
    const recordTable = document.getElementById('recordTable').querySelector('tbody');

    const h = 150; // taller lighthouse
    let trialCount = 0;

    function drawDiagram(angle) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background: sky above, sea below
      ctx.fillStyle = "#87CEEB"; // sky
      ctx.fillRect(0, 0, canvas.width, 350);
      ctx.fillStyle = "#1E90FF"; // sea
      ctx.fillRect(0, 350, canvas.width, 50);

      ctx.font = "20px Arial bold";

      // Lighthouse
      ctx.fillStyle = 'white';
      ctx.fillRect(550, 350 - h, 40, h);
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(570, 350 - h, 20, 0, Math.PI, true);
      ctx.fill();

      // Windows
      ctx.fillStyle = 'black';
      ctx.fillRect(560, 350 - h + 30, 20, 10);
      ctx.fillRect(560, 350 - h + 70, 20, 10);

      // Boat position
      const radians = angle * Math.PI / 180;
      let x = h / Math.tan(radians);
      let boatX = 550 - x;
      if (boatX + 40 > 530) boatX = 490; // stop before lighthouse

      // Boat hull
      ctx.fillStyle = 'brown';
      ctx.beginPath();
      ctx.moveTo(boatX, 350);
      ctx.lineTo(boatX + 40, 350);
      ctx.lineTo(boatX + 30, 370);
      ctx.lineTo(boatX + 10, 370);
      ctx.closePath();
      ctx.fill();

      // Mast + sail
      ctx.strokeStyle = 'black';
      ctx.beginPath();
      ctx.moveTo(boatX + 20, 350);
      ctx.lineTo(boatX + 20, 310);
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(boatX + 20, 310);
      ctx.lineTo(boatX + 40, 330);
      ctx.lineTo(boatX + 20, 350);
      ctx.closePath();
      ctx.fill();

      // Triangle lines
      ctx.strokeStyle = 'green';
      ctx.beginPath();
      ctx.moveTo(boatX + 20, 350);
      ctx.lineTo(550, 350);
      ctx.stroke();
      ctx.fillStyle = 'black';
      ctx.fillText("Horizontal Distance (x)", boatX + (x/2), 380);

      ctx.strokeStyle = 'black';
      ctx.beginPath();
      ctx.moveTo(550, 350);
      ctx.lineTo(550, 350 - h);
      ctx.stroke();
      ctx.fillText("Height (h)", 600, 350 - h/2);

      ctx.strokeStyle = 'red';
      ctx.beginPath();
      ctx.moveTo(boatX + 20, 350);
      ctx.lineTo(550, 350 - h);
      ctx.stroke();

      // Angle arc
      ctx.beginPath();
      ctx.arc(boatX + 20, 350, 40, 0, -radians, true);
      ctx.strokeStyle = 'red';
      ctx.stroke();

      // θ label: always to the right of arc
      const arcRadius = 40;
      const arcX = boatX + 20 + arcRadius * Math.cos(-radians/2);
      const arcY = 350 + arcRadius * Math.sin(-radians/2);
      ctx.fillStyle = 'red';
      ctx.fillText("θ", arcX + 15, arcY); // push right by +15px

      angleValue.textContent = angle + "°";
      return {angle, x, h};
    }

    let currentData = drawDiagram(30);

    slider.addEventListener('input', () => {
      currentData = drawDiagram(parseInt(slider.value));
    });

    recordBtn.addEventListener('click', () => {
      trialCount++;
      const row = document.createElement('tr');
      row.innerHTML = `<td>${trialCount}</td>
                       <td>${currentData.angle}</td>
                       <td>${currentData.x.toFixed(1)} m</td>
                       <td>${currentData.h} m</td>`;
      recordTable.appendChild(row);
    });
  </script>
</body>
</html>
